scenario_description: A coffee roaster committed to direct trade wants to secure coffee
  sourcing from a cooperative. The cooperative's pricing reflects living-wage commitments.
  A commodity broker offers the same grade at 35% less. The roaster's largest client
  has requested proof of ethical sourcing for their ESG report.
metadata:
  difficulty_tier: 2
  tiering_rule_version: task20a2-v1
  tiering_reason: walkaway_or_constraint_pressure
