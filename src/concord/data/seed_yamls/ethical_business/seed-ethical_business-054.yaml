  reputation: null
  relationship_history: []
  price_weight: 0.5
  issue_utilities:
    audit_frequency_months:
      type: numeric
      weight: 0.1
      best: 3
      worst: 12
    transition_period_months:
      type: target_numeric
      weight: 0.1
      target: 12
      worst_distance: 18
    environmental_commitments:
      type: set
      weight: 0.1
      scores:
        sea_freight: 0.4
        regenerative_certification: 0.35
        emissions_reporting: 0.25
    labor_standards:
      type: set
      weight: 0.1
      scores:
        no_child_labor: 0.4
        living_wage: 0.3
        independent_audits: 0.3
    transparency_reports:
      type: boolean
      weight: 0.1
      scores:
        'true': 1.0
        'false': 0.0
seller_context:
  batna: 15000
  reserve_price: 19000
  hard_constraints:
  - minimum_order_1000_units
  private_info:
  - offset_quality_is_equivalent_to_gold_standard_independent_audit
  - gold_standard_registration_in_progress
